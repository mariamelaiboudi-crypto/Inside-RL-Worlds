version: '3.8'

services:
  inside-rl:
    build:
      context: .
      dockerfile: Dockerfile
    image: inside-reinforcement-learning:latest
    container_name: inside-rl-app
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development mode (hot reload)
  inside-rl-dev:
    image: node:18-alpine
    container_name: inside-rl-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    environment:
      - NODE_ENV=development
    profiles:
      - dev
